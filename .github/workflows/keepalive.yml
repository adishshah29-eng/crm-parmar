name: Supabase keepalive

# Free-tier projects pause after 7 days with no requests. This pings every
# 3 days so the shared dev database never goes cold on the team.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sources?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Keepalive failed — project may be paused. Restore it from the dashboard."
            exit 1
          fi
